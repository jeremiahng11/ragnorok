services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    restart: unless-stopped
    environment:
      # These have REAL fallback values, not empty ones. Coolify's variable
      # plumbing has proven unreliable here — an empty value makes MariaDB
      # refuse to initialise and crash-loop with "Database is uninitialized and
      # password option is not specified". The :- form catches both unset AND
      # empty, so the stack always comes up.
      #
      # Override them in Coolify (runtime variables, NOT build variables) and
      # use the same value in conf/import/inter_conf.txt.
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-ragnarok_root_CHANGEME}
      MARIADB_DATABASE: ragnarok
      MARIADB_USER: ragnarok
      MARIADB_PASSWORD: ${DB_PASSWORD:-ragnarok_CHANGEME}
    volumes:
      - ragnarok-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 10s
      retries: 20
      # First boot imports the rAthena schema before the server accepts
      # connections. Give it room; failures during start_period don't count.
      start_period: 180s

  rathena:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RO_PACKETVER: ${RO_PACKETVER:-20180620}
        BUILD_JOBS: ${BUILD_JOBS:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Raw TCP — these bypass the Coolify proxy entirely.
      - "6900:6900"   # login server
      - "6121:6121"   # char server
      - "5121:5121"   # map server
    volumes:
      - rathena-conf:/opt/rathena/conf/import
      - rathena-logs:/opt/rathena/log

volumes:
  ragnarok-db:
  rathena-conf:
  rathena-logs:
