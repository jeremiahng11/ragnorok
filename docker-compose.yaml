services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    restart: unless-stopped
    environment:
      # Deliberately using the :- (default) form and not the :? (required)
      # form. Coolify interpolates this file during the BUILD phase using
      # build-time.env, which contains only build variables — a "required"
      # guard here aborts the build before it starts, even when the variable
      # is correctly set as a runtime variable.
      # If these end up empty at runtime, MariaDB's own entrypoint fails loudly
      # with "Database is uninitialized and password option is not specified".
      # Check `docker logs <db-container>`.
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-}
      MARIADB_DATABASE: ragnarok
      MARIADB_USER: ragnarok
      MARIADB_PASSWORD: ${DB_PASSWORD:-}
    volumes:
      - ragnarok-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 10s
      retries: 20
      # First boot imports the rAthena schema before the server accepts
      # connections. Give it room; failures during start_period don't count.
      start_period: 180s

  rathena:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RO_PACKETVER: ${RO_PACKETVER:-20180620}
        BUILD_JOBS: ${BUILD_JOBS:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Raw TCP — these bypass the Coolify proxy entirely.
      - "6900:6900"   # login server
      - "6121:6121"   # char server
      - "5121:5121"   # map server
    volumes:
      - rathena-conf:/opt/rathena/conf/import
      - rathena-logs:/opt/rathena/log

volumes:
  ragnarok-db:
  rathena-conf:
  rathena-logs:
